{% load allauth %}
{% if attrs.errors %}
<div class="mb-1 text-xs text-red-600">{{ attrs.errors }}</div>
{% endif %}
<div class="{% if attrs.type == 'checkbox' or attrs.type == 'radio' %}flex items-center gap-2 mb-3{% else %}mb-4{% endif %}">
  {% if attrs.type == "textarea" %}
    <label for="{{ attrs.id }}" class="block text-sm font-medium text-gray-700 mb-1">
      {% slot label %}{% endslot %}
    </label>
    <textarea
      {% if attrs.required %}required{% endif %}
      {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">{% slot value %}{% endslot %}</textarea>
  {% elif attrs.type == "checkbox" or attrs.type == "radio" %}
    <input
      type="{{ attrs.type }}"
      {% if attrs.required %}required{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.checked %}checked{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
      class="h-4 w-4 text-blue-600 border-gray-300 rounded">
    <label for="{{ attrs.id }}" class="text-sm text-gray-700">
      {% slot label %}{% endslot %}
    </label>
  {% else %}
    <label for="{{ attrs.id }}" class="block text-sm font-medium text-gray-700 mb-1">
      {% slot label %}{% endslot %}
    </label>
    <input
      type="{{ attrs.type }}"
      {% if attrs.required %}required{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
      {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
      {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
  {% endif %}
  {% if slots.help_text %}
    <span class="text-xs text-gray-500 mt-1 block">{% slot help_text %}{% endslot %}</span>
  {% endif %}
</div>
