{% load allauth %}
<div class="mb-4 px-4 py-3 rounded-lg text-sm
  {% if attrs.alert_type == 'danger' or attrs.alert_type == 'error' %}bg-red-50 border border-red-200 text-red-700
  {% elif attrs.alert_type == 'success' %}bg-green-50 border border-green-200 text-green-700
  {% elif attrs.alert_type == 'warning' %}bg-yellow-50 border border-yellow-200 text-yellow-700
  {% else %}bg-blue-50 border border-blue-200 text-blue-700{% endif %}">
  {% slot %}{% endslot %}
</div>
