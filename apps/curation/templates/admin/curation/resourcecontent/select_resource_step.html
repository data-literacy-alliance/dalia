{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-semibold text-gray-900 dark:text-white mb-6">{% trans "Select resource" %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="border border-gray-200 dark:border-gray-700 rounded-md mb-6 p-6">
      {{ form.resource.errors }}
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1" for="{{ form.resource.id_for_label }}">
          {{ form.resource.label }} <span class="text-red-500">*</span>
        </label>
        {{ form.resource }}
        {% if form.resource.help_text %}
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ form.resource.help_text }}</p>
        {% endif %}
      </div>
    </div>
    <div class="flex justify-start">
      <button type="submit"
        class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 dark:bg-primary-700 dark:hover:bg-primary-600">
        {% trans "Continue" %} &rarr;
      </button>
    </div>
  </form>
</div>
{% endblock %}
