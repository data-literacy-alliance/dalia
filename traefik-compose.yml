version: "3.8"

services:
  #####################################
  ### TRAEFIK - routing the traffik ###
  #####################################
  traefik:
    image: "docker.io/traefik:latest"
    security_opt:
      - label=type:container_runtime_t
    env_file:
      - "./traefik/.env"
    log_driver: none
    command:
      - "--log.level=DEBUG" # The log levels in order of severity are DEBUG, INFO, WARN, ERROR, FATAL and PANIC. DEBUG is the lowest level and PANIC the highest. Setting a higher level reduces the amount of messages you receive.
      - "--accesslog=false"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/srv/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:52080"
      - "--entryPoints.web.forwardedHeaders.insecure"
    ports:
      - "52080:52080" #production
      - "8080:8080" #traefik dashboard
    volumes:
      - "/run/user/${HOSTUID}/podman/podman.sock:/var/run/docker.sock:ro"
      - "./traefik/dynamic.yml:/srv/dynamic.yml:ro"
      - "./maintenance:/usr/share/nginx/html:ro" # Mount the maintenance directory
      - "./hosts:/etc/hosts" # Static hosts IP configuration
    networks:
      proxy-net:
        ipv4_address: 172.20.0.10
    dns:
      - 172.20.0.1
    restart: always
    labels:
      - "traefik.http.middlewares.maintenance-fallback.errors.status=500-599,404,400-403"
      - "traefik.http.middlewares.maintenance-fallback.errors.service=maintenance-service"
      - "traefik.http.middlewares.maintenance-fallback.errors.query=HostRegexp(`^dalia-.*$`)"

  maintenance-server:
    image: docker.io/library/nginx:alpine
    volumes:
      - "./maintenance:/usr/share/nginx/html:ro"
      - "./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    networks:
      proxy-net:
        ipv4_address: 172.20.0.20
    dns:
      - 172.20.0.1

  admin-server:
    build:
      context: .
      dockerfile: ./admin/Dockerfile
    networks:
      proxy-net:
        ipv4_address: 172.20.0.40
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./traefik/.env
    volumes:
      - ./hosts:/etc/hosts # Mount the hosts file
      - /opt/container-status:/status:ro # Building/Running logs
    dns:
      - 172.20.0.1

