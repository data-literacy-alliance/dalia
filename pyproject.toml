[project]
name = "dalia20"
version = "1.0.0"
description = "ICZ - Django 6.0 Starter Template"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "ICZ Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core Django
    "Django>=6.0,<6.1",

    # Admin Panel
    "django-unfold>=0.79.0,<1.0",
    "django-import-export>=4.0,<5.0",

    # REST API
    "djangorestframework>=3.15.2,<4.0",
    "django-filter>=24.0,<25.0",
    "drf-spectacular>=0.28.0,<1.0",

    # Background Tasks
    "django-tasks>=0.12.0,<1.0",

    # Security (Production)
    "django-axes>=7.0.0,<8.0",
    "djangorestframework-simplejwt>=5.4.0,<6.0",
    "django-otp>=1.5.0,<2.0",
    "django-two-factor-auth>=1.17.0,<2.0",
    "qrcode>=8.0,<9.0",
    "argon2-cffi>=23.1.0,<24.0",

    # Database
    "psycopg[binary]>=3.2.0,<4.0",

    # Cache/Queue
    "redis>=5.0.0,<6.0",

    # Production Server
    "gunicorn>=23.0.0,<24.0",

    # Utilities
    "django-environ>=0.11.0,<1.0",
    "Pillow>=11.0.0,<12.0",
    "python-dateutil>=2.8.0",

    # Authentication (allauth + NFDI AAI OIDC)
    "django-allauth[socialaccount,headless,openid_connect]>=65.6.0",

    # CORS
    "django-cors-headers>=4.7",

    # Curation model dependencies
    "django-taggit>=6.1.0",
    "django-sortedm2m>=4.0.0",

    # API helpers
    "djangorestframework-dataclasses>=1.3.1",

    # Elasticsearch (for future development)
    "django-elasticsearch-dsl>=8.0",
    "elasticsearch-dsl>=8.0",
    "django-elasticsearch-dsl-drf>=0.22.5",

    # Disabled app dependencies (search/recommendation/entity_mapping — future use)
    "rdflib>=7.0.0",
    "sparqlwrapper>=2.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0,<9.0",
    "pytest-django>=4.9.0,<5.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-xdist>=3.6.0,<4.0",
    "factory-boy>=3.3.0,<4.0",
    "faker>=32.0.0,<33.0",

    # Code Quality
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "django-stubs[compatible-mypy]>=5.1.0,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.0,<4.0",

    # Development Tools
    "django-debug-toolbar>=4.4.0,<5.0",
    "django-extensions>=3.2.0,<4.0",
    "ipython>=8.29.0,<9.0",

    # Security Auditing
    "pip-audit>=2.7.0,<3.0",
    "safety>=3.2.0,<4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--reuse-db --strict-markers -v"
testpaths = ["apps"]
norecursedirs = ["data", "staticfiles", "media", "logs", ".venv", "migrations"]
markers = [
    "slow: marks tests as slow",
    "postgres: requires PostgreSQL",
    "integration: integration tests",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "__pycache__", "*.pyc"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "factory.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.base"
