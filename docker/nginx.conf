# Dual-upstream: Django (web:8000) and Next.js (frontend:3000)
upstream django {
    server web:8000;
}

upstream nextjs {
    server frontend:3000;
}

# Website (dalia.education) host routing. X-Forwarded-Host wins over Host; a
# comma list (multiple proxies / spoofing) maps to "" and therefore to search.
map $http_x_forwarded_host $dalia_req_host {
    ""       $host;
    ~,       "";
    default  $http_x_forwarded_host;
}

map $dalia_req_host $dalia_site {
    ~*^(www\.)?dalia\.education$                                  website;
    ~*^dalia-home-[a-z0-9-]+\.web\.gateway\.ionos\.coscine\.dev$   website;
    default                                                       search;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Django: REST API (search, curation, auth token, health)
    location /api/ {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django: Admin panel
    # No trailing slash in location — nginx matches /admin and /admin/* alike.
    # Django's APPEND_SLASH=True then issues 301 /admin → /admin/ automatically.
    # Adding new Django paths here follows the same pattern: no trailing slash needed.
    location /admin {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django: two-factor-auth login (username-based, used by admin redirect)
    location /account {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django: Authentication (allauth / NFDI AAI OIDC)
    location /accounts {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django: NFDI custom login view
    location /login {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django: User profile page (exact match only — /profile/[part]/ subpaths are Next.js pages)
    location = /profile/ {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django: SPARQL read-only proxy (ported from Next.js API route)
    location = /sparql-api {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
    }

    # Django collectstatic output
    location /static/ {
        alias /app/staticfiles/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Website (dalia.education): Django under the internal prefix /site/.
    # Reachable only through the rewrite in "location /" (internal => 404 otherwise).
    location /site/ {
        internal;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Vary "X-Forwarded-Host" always;
    }

    # Django media files (nosniff everywhere; add_header is not inherited, so
    # each location repeats alias/expires/Cache-Control and its own headers)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded images: never executable/active content
    location /media/website/ {
        alias /app/media/website/;
        # Explicit types: subtitles must be text/vtt or browsers reject them under nosniff
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            video/mp4 mp4;
            text/vtt vtt;
        }
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location /media/pages/media/ {
        alias /app/media/pages/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Draft DOCX files are used server-side only, never public
    location /media/pages/docx/ {
        return 404;
    }

    # Scratch area, never public
    location /media/tmp/ {
        return 404;
    }

    # Next.js static assets (content-hashed filenames, long cache)
    location /_next/ {
        if ($dalia_site = website) { return 404; }
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Default: Next.js frontend (SSR pages)
    location / {
        if ($dalia_site = website) { rewrite ^/(.*)$ /site/$1 last; }
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_redirect off;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
